model:
  provider: openrouter
  default: xiaomi/mimo-v2.6-pro
  max_tokens: 65536
  context_length: 1050000
  base_url: https://openrouter.ai/api/v1
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    key_env: OPENROUTER_API_KEY
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-OpenRouter-Title: Itonami By KotobaLabs
      X-Title: Itonami By KotobaLabs
agent:
  max_turns: 500
  run_budget_seconds: 1800
